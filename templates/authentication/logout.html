{% extends 'base.html' %}

{% block title %}Logout - Inventory Management System{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">Logout</h4>
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="bi bi-box-arrow-left display-1 text-warning"></i>
                    </div>
                    
                    <h5 class="mb-3">Are you sure you want to logout?</h5>
                    <p class="text-muted mb-4">
                        You will be redirected to the login page.
                    </p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-box-arrow-left me-2"></i>Yes, Logout
                            </button>
                            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
