            <span class="navbar-toggler-icon"></span>

        <div class="collapse navbar-collapse" id="navbarMain">
            {% if user.is_authenticated %}

                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"

                    </li>

                        <a class="nav-link" href="#">
                            <i class="bi bi-box me-1"></i>Inventory Items

                        <a class="nav-link {% if 'categories' in request.resolver_match.app_name %}active{% endif %}" 
                           href="{% url 'categories:list' %}">
                            <i class="bi bi-tags me-1"></i>Categories
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-cash-stack me-1"></i>Sales
                        </a>
                    </li>

                <ul class="navbar-nav ms-auto">

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'login' %}active{% endif %}"
